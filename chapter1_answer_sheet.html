<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Chapter 1 – Answer Sheet</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <div class="card">
            <div class="info">
                <div><label>Name</label><input data-f="name"></div>
                <div><label>ID</label><input data-f="id"></div>
            </div>
        </div>
        <div class="bar noprint">
            <div class="prog"><span id="pt"></span>
                <div class="pb"><i id="pf"></i></div>
            </div>
            <button id="nx">Next unanswered</button><button id="cl">Clear</button><button class="p"
                id="pr">Print</button>
        </div>
        <div id="app"></div>
        <p class="hint">Answers and info save automatically in this browser. Tap a selected answer again to unselect it.
        </p>
    </main>
    <script src="js/chapter1.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
